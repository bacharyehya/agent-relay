name: AgentRelay
options:
  bundleIdPrefix: io.agentrelay
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
packages:
  AgentRelayPackage:
    path: .
targets:
  AgentRelayMac:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.agentrelay.app
        PRODUCT_NAME: Agent Relay
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 5
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agent Relay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W6C62KF3PU
        CODE_SIGN_ENTITLEMENTS: App/MacApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - App/MacApp/AgentRelayMacApp.swift
      - App/Assets.xcassets
      - App/Resources
    dependencies:
      - package: AgentRelayPackage
        product: AppCore
      - package: AgentRelayPackage
        product: RelayCloudClient
      - package: AgentRelayPackage
        product: RelayCloudUI
  AgentRelayiOS:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.agentrelay.app
        PRODUCT_NAME: Agent Relay
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 5
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agent Relay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W6C62KF3PU
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - App/iOS
      - App/Assets.xcassets
      - App/Resources
    dependencies:
      - package: AgentRelayPackage
        product: RelayCloudUI
